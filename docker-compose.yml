version: "3.8"

services:
  hitomi:
    build: .
    container_name: hitomi
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      CLIENT_ID: ${CLIENT_ID}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
